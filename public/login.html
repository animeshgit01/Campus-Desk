<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Desk - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-box card">
    <h2 id="heading">Campus Desk Login</h2>
    <form id="loginForm">
      <input name="username" placeholder="Username" required>
      <input name="password" type="password" placeholder="Password" required>
      <button type="submit" id="submitBtn">Login</button>
    </form>
    <p id="msg" class="msg"></p>
    <p><a href="#" id="toggle" class="switch">New user? Register</a></p>
  </div>

  <script>
    let registering = false;
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');

    function setMode(reg) {
      registering = reg;
      document.getElementById('heading').textContent = reg ? 'Create Account' : 'Campus Desk Login';
      document.getElementById('submitBtn').textContent = reg ? 'Register' : 'Login';
      document.getElementById('toggle').textContent = reg ? 'Have an account? Login' : 'New user? Register';
    }

    document.getElementById('toggle').onclick = e => {
      e.preventDefault();
      setMode(!registering);
      msg.textContent = '';
    };

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const res = await fetch(registering ? '/auth/register' : '/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.fromEntries(new FormData(form)))
      });
      const out = await res.json();

      if (!res.ok) {
        msg.style.color = '#dc2626';
        msg.textContent = out.error;
      } else if (registering) {
        setMode(false);
        msg.style.color = '#16a34a';
        msg.textContent = 'Account created. Please login.';
      } else {
        location.href = '/';
      }
    });
  </script>
</body>
</html>
